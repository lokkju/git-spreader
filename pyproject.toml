[project]
name = "git-spreader"
dynamic = ["version"]
description = "Make 3am commit binges look like responsible adult behavior"
readme = "README.md"
license = "LicenseRef-Polyform-Shield-1.0.0"
license-files = ["LICENSE.md"]
keywords = ["git", "commits", "timestamps", "rewrite", "contribution-graph", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: Other/Proprietary License",
    "Topic :: Software Development :: Version Control :: Git",
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15",
    "rich>=13",
    "holidays>=0.60",
    "tomli-w>=1.0",
]

[project.urls]
Homepage = "https://github.com/lokkju/git-spreader"
Repository = "https://github.com/lokkju/git-spreader"
Issues = "https://github.com/lokkju/git-spreader/issues"
Changelog = "https://github.com/lokkju/git-spreader/releases"
License = "https://polyformproject.org/licenses/shield/1.0.0"

[project.scripts]
git-spreader = "git_spreader.cli:app"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/git_spreader"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "pyright>=1.1",
]

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
